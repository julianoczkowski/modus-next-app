version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install dependencies for the entire workspace
        - npm ci --ignore-scripts
        # Install Husky separately to avoid prepare script issues
        - npm install husky --save-dev
    build:
      commands:
        # Build the main app workspace
        - npm run build --workspace=modus-next-app
  artifacts:
    # Point to the Next.js build output in the app workspace
    baseDirectory: packages/app/.next
    files:
      - "**/*"
  cache:
    paths:
      # Cache workspace dependencies
      - node_modules/**/*
      - packages/app/node_modules/**/*
      # Cache Next.js build cache
      - packages/app/.next/cache/**/*
      # Cache npm cache
      - ~/.npm/**/*
