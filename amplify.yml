version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install dependencies for the entire workspace (hoisted to root)
        - npm ci
    build:
      commands:
        # Build the main app workspace
        - npm run build --workspace=modus-next-app
  artifacts:
    # Point to the Next.js build output in the app workspace
    baseDirectory: packages/app/.next
    files:
      - "**/*"
  cache:
    paths:
      # Cache hoisted workspace dependencies (root node_modules)
      - node_modules/**/*
      # Cache Next.js build cache
      - packages/app/.next/cache/**/*
      # Cache npm cache
      - ~/.npm/**/*
